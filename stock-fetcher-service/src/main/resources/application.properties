server.port=8081
spring.application.name=stock-fetcher-service

# PostgreSQL/TimescaleDB Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/stockpulse
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# HIKARICP CONNECTION POOL SETTINGS
# ============================================
# Maximum number of connections in the pool
spring.datasource.hikari.maximum-pool-size=20

# Minimum number of idle connections
spring.datasource.hikari.minimum-idle=5

# Maximum time (ms) that a client will wait for a connection
spring.datasource.hikari.connection-timeout=30000

# Maximum time (ms) that a connection can remain idle in the pool
spring.datasource.hikari.idle-timeout=600000

# Maximum lifetime (ms) of a connection in the pool
spring.datasource.hikari.max-lifetime=1800000

# Connection test query
spring.datasource.hikari.connection-test-query=SELECT 1

# Pool name
spring.datasource.hikari.pool-name=MarketDataHikariPool

# Auto-commit behavior
spring.datasource.hikari.auto-commit=true

# Leak detection threshold (ms) - 0 to disable
spring.datasource.hikari.leak-detection-threshold=60000

# ============================================
# JPA / HIBERNATE CONFIGURATION
# ============================================

# Hibernate DDL auto (none, validate, update, create, create-drop)
spring.jpa.hibernate.ddl-auto=none

# Show SQL queries in console (set to false in production)
spring.jpa.show-sql=false

# Format SQL queries
spring.jpa.properties.hibernate.format_sql=true

# SQL comments in logs
spring.jpa.properties.hibernate.use_sql_comments=true

# Hibernate dialect for PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


