# External Market Data Provider Configuration
market.data.provider.base-url=https://query1.finance.yahoo.com
market.data.provider.quote-endpoint=/v7/finance/quote
market.data.provider.chart.endpoint=/v8/finance/chart
market.data.provider.search.endpoint=/v1/finance/search
market.data.provider.company.summary.endpoint=/v10/finance/quoteSummary
market.data.provider.market.mover.endpoint=/v1/finance/screener/predefined/saved
market.data.provider.crumb-endpoint=/v1/test/getcrumb

# Cookie URLs (comma-separated, will try in order)
market.data.provider.cookie-urls=https://finance.yahoo.com,https://www.yahoo.com

# Timeouts and intervals
market.data.provider.timeout-seconds=15
market.data.provider.crumb-refresh-interval-minutes=30
market.data.provider.max-retries=1

# HTTP Headers
market.data.provider.user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
market.data.provider.accept-header=application/json
market.data.provider.accept-language=en-US,en;q=0.9
market.data.provider.referer=https://finance.yahoo.com/