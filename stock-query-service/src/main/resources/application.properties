server.port=8082
spring.application.name=stock-query-service

# External Services
stock.fetcher.url=http://localhost:8081

# PostgreSQL/TimescaleDB Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/stockpulse
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# HIKARICP CONNECTION POOL SETTINGS
# ============================================
# Maximum number of connections in the pool
spring.datasource.hikari.maximum-pool-size=20

# Minimum number of idle connections
spring.datasource.hikari.minimum-idle=5

# Maximum time (ms) that a client will wait for a connection
spring.datasource.hikari.connection-timeout=30000

# Maximum time (ms) that a connection can remain idle in the pool
spring.datasource.hikari.idle-timeout=600000

# Maximum lifetime (ms) of a connection in the pool
spring.datasource.hikari.max-lifetime=1800000

# Connection test query
spring.datasource.hikari.connection-test-query=SELECT 1

# Pool name
spring.datasource.hikari.pool-name=MarketDataHikariPool

# Auto-commit behavior
spring.datasource.hikari.auto-commit=true

# Leak detection threshold (ms) - 0 to disable
spring.datasource.hikari.leak-detection-threshold=60000

# ============================================
# JPA / HIBERNATE CONFIGURATION
# ============================================

# Hibernate DDL auto (none, validate, update, create, create-drop)
spring.jpa.hibernate.ddl-auto=none

# Show SQL queries in console (set to false in production)
spring.jpa.show-sql=false

# Format SQL queries
spring.jpa.properties.hibernate.format_sql=true

# SQL comments in logs
spring.jpa.properties.hibernate.use_sql_comments=true

# Hibernate dialect for PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect



#kafka properties
# Both services must point to SAME broker
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=1
spring.kafka.producer.retries=3
spring.kafka.producer.properties.retry.backoff.ms=1000
kafka.topic.index-quote=stock.quotes.index.v1

spring.jackson.serialization.write_dates_as_timestamps=false

# Index ingestion scheduler
scheduler.index.fixed-delay=30000

# Neutral defaults used when a country schedule is not configured
scheduler.index.default-zone-id=UTC
scheduler.index.default-market-open=00:00
scheduler.index.default-market-close=23:59
scheduler.index.default-holiday-file=

# Only configured countries are scheduled. Keep as '1' to run India only.
scheduler.index.enabled-country-ids=1

# Country-specific market calendar rules
scheduler.index.country-schedules[1].zone-id=Asia/Kolkata
scheduler.index.country-schedules[1].market-open=09:15
scheduler.index.country-schedules[1].market-close=15:30
scheduler.index.country-schedules[1].holiday-file=nse_bse_holidays_2026.csv

# Example for enabling additional countries:
# scheduler.index.enabled-country-ids=1,2
# scheduler.index.country-schedules[2].zone-id=America/New_York
# scheduler.index.country-schedules[2].market-open=09:30
# scheduler.index.country-schedules[2].market-close=16:00
