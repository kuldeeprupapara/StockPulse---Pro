server.port=8083
spring.application.name=stock-stream-service

# Both services must point to SAME broker
# stream service & query service
spring.kafka.bootstrap-servers=localhost:9092
kafka.topic.index-quote=stock.quotes.index.v1
kafka.consumer.concurrency=3


# Consumer group ID
# Kafka tracks consumed offset per group
# All instances of this service share same group-id
# ? no duplicate SSE broadcasts if scaled horizontally
spring.kafka.consumer.group-id=stockpulse-sse-group

# Deserialize key + value as plain String
# Must be symmetric with producer's StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# latest  ? only consume NEW messages after service starts
# earliest ? consume ALL messages from beginning (use for debugging)
spring.kafka.consumer.auto-offset-reset=latest

# Auto commit offset after message is processed
# true  = Kafka auto-commits every 5 seconds (simpler)
# false = manual commit (more control, more code)
spring.kafka.consumer.enable-auto-commit=true

# Screen-scoped streaming controls
stream.subscription.emitter-timeout-ms=9223372036854775807
stream.subscription.max-symbols-default=25
stream.subscription.max-symbols-listing=10
stream.subscription.max-symbols-detail=1
stream.subscription.max-symbols-search-selected=1
stream.subscription.max-symbols-watchlist=50
stream.subscription.max-symbols-portfolio=50

# Deserialize OffsetDateTime as ISO-8601 string
# Must match how stock-query-service serialized it
spring.jackson.serialization.write-dates-as-timestamps=false

# ?? Actuator ??????????????????????????????????????????????????????????????
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ?? Logging ???????????????????????????????????????????????????????????????
logging.level.com.stockmarket.stream=DEBUG
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=WARN

